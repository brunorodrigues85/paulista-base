function toDateObj(d, h){
const [dd,mm,yyyy] = d.split('/');
const [hh,mi] = h.split(':');
return new Date(yyyy, mm-1, dd, hh, mi);
}

function gameCardHtml(g, showCat){
const encTeam = encodeURIComponent(g.home).replace(/%2F/g, '/');
const fpvUrl = 'https://www.fpv.com.br/2018/bd/vq_calend_iframe.asp?cat=&camp=&naipe=&datini=' + g.data + '&datfin=' + g.data + '&eq=' + encTeam;
return `<div class="game-card">
<div class="card-top">
<div>
<div class="matchup"><span class="home">${g.home}</span><span class="vs">x</span>${g.away}</div>
${showCat ? '<span class="cat-tag">'+g.camp+'</span>' : ''}
</div>
<div class="details">📅 ${g.data} · ⏰ ${g.hora}<br>📍 ${g.local}</div>
</div>
<a href="${fpvUrl}" class="fpv-link" target="_blank" rel="noopener noreferrer">🔗 Ver no Calendário FPV</a>
</div>`;
}

function renderByData(){
const sorted = games.slice().sort((a,b)=> toDateObj(a.data,a.hora) - toDateObj(b.data,b.hora));
let out = '<div class="section">';
let lastDate = null;
sorted.forEach(g => {
if (g.data !== lastDate) {
out += '<div class="day-divider"><span>'+g.data+'</span></div>';
lastDate = g.data;
}
out += gameCardHtml(g, true);
});
out += '</div>';
return out;
}
